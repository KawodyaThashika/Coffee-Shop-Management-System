<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin — Sip & Savor Café</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Outfit:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="admin.css">
</head>

<body class="admin-body">

    <!-- ══ LOGIN SCREEN ══ -->
    <div id="login-screen" class="login-screen">
        <div class="login-card">
            <div class="login-logo">
                <span>☕</span>
                <h1>Sip &amp; Savor</h1>
                <p>Admin Dashboard</p>
            </div>
            <form id="login-form" class="login-form" novalidate>
                <div class="al-group">
                    <label for="admin-username">Username</label>
                    <div class="input-wrap">
                        <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                            <circle cx="12" cy="7" r="4" />
                        </svg>
                        <input type="text" id="admin-username" placeholder="admin" autocomplete="username" required>
                    </div>
                </div>
                <div class="al-group">
                    <label for="admin-password">Password</label>
                    <div class="input-wrap">
                        <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
                            <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                        </svg>
                        <input type="password" id="admin-password" placeholder="••••••••"
                            autocomplete="current-password" required>
                        <button type="button" class="pwd-toggle" id="pwd-toggle"
                            aria-label="Toggle password visibility">
                            <svg id="eye-icon" xmlns="http://www.w3.org/2000/svg" width="17" height="17"
                                viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                                <circle cx="12" cy="12" r="3" />
                            </svg>
                        </button>
                    </div>
                </div>
                <p class="login-error" id="login-error"></p>
                <button type="submit" class="al-btn" id="login-btn">
                    <span>Sign In</span>
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2">
                        <line x1="5" y1="12" x2="19" y2="12" />
                        <polyline points="12 5 19 12 12 19" />
                    </svg>
                </button>
                <p class="login-hint">
                    Default credentials: <strong>admin</strong> / <strong>admin123</strong>
                </p>
            </form>
            <a href="index.html" class="back-to-site">← Back to café site</a>
        </div>
        <div class="login-bg-panel">
            <img src="https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?auto=format&fit=crop&w=900&q=80"
                alt="Café background">
            <div class="login-bg-overlay"></div>
            <div class="login-bg-text">
                <h2>"Great coffee starts<br>with great management."</h2>
            </div>
        </div>
    </div>

    <!-- ══ ADMIN DASHBOARD ══ -->
    <div id="dashboard" class="dashboard" hidden>

        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <span class="sidebar-logo">☕ Sip &amp; Savor</span>
                <button class="sidebar-close" id="sidebar-close" aria-label="Close sidebar">✕</button>
            </div>
            <nav class="sidebar-nav">
                <a href="#" class="sidebar-link active" data-view="orders" id="nav-orders">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2">
                        <path d="M9 11l3 3L22 4" />
                        <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11" />
                    </svg>
                    Orders
                    <span class="sidebar-badge" id="pending-badge">0</span>
                </a>
                <a href="#" class="sidebar-link" data-view="analytics" id="nav-analytics">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="20" x2="18" y2="10" />
                        <line x1="12" y1="20" x2="12" y2="4" />
                        <line x1="6" y1="20" x2="6" y2="14" />
                    </svg>
                    Analytics
                </a>
            </nav>
            <div class="sidebar-footer">
                <button class="sidebar-link logout-btn" id="logout-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                        <polyline points="16 17 21 12 16 7" />
                        <line x1="21" y1="12" x2="9" y2="12" />
                    </svg>
                    Logout
                </button>
            </div>
        </aside>

        <!-- Main -->
        <div class="main-area">
            <!-- Top Bar -->
            <header class="topbar">
                <div class="topbar-left">
                    <button class="menu-toggle" id="menu-toggle" aria-label="Toggle sidebar">
                        <span></span><span></span><span></span>
                    </button>
                    <div class="topbar-title">
                        <h2 id="view-title">Orders</h2>
                        <span id="view-subtitle" class="view-subtitle"></span>
                    </div>
                </div>
                <div class="topbar-right">
                    <button class="topbar-btn" id="refresh-btn" title="Refresh orders">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2">
                            <polyline points="23 4 23 10 17 10" />
                            <polyline points="1 20 1 14 7 14" />
                            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15" />
                        </svg>
                    </button>
                    <button class="topbar-btn danger-btn" id="clear-all-btn" title="Clear all orders">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2">
                            <polyline points="3 6 5 6 21 6" />
                            <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6" />
                            <path d="M10 11v6" />
                            <path d="M14 11v6" />
                            <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2" />
                        </svg>
                    </button>
                    <div class="admin-avatar" title="Logged in as admin">A</div>
                </div>
            </header>

            <!-- ── ORDERS VIEW ── -->
            <div class="view active" id="view-orders">
                <!-- KPI Cards -->
                <div class="kpi-row" id="kpi-row"></div>

                <!-- Filters -->
                <div class="orders-toolbar">
                    <div class="status-filters" id="status-filters">
                        <button class="sf-btn active" data-status="all">All</button>
                        <button class="sf-btn" data-status="Pending">Pending</button>
                        <button class="sf-btn" data-status="Preparing">Preparing</button>
                        <button class="sf-btn" data-status="Ready">Ready</button>
                        <button class="sf-btn" data-status="Completed">Completed</button>
                        <button class="sf-btn" data-status="Cancelled">Cancelled</button>
                    </div>
                    <div class="orders-search-wrap">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2">
                            <circle cx="11" cy="11" r="8" />
                            <line x1="21" y1="21" x2="16.65" y2="16.65" />
                        </svg>
                        <input type="search" id="orders-search" class="orders-search"
                            placeholder="Search by name or order ID…">
                    </div>
                </div>

                <!-- Orders Table -->
                <div class="orders-table-wrap">
                    <table class="orders-table" id="orders-table">
                        <thead>
                            <tr>
                                <th>Order ID</th>
                                <th>Customer</th>
                                <th>Items</th>
                                <th>Total</th>
                                <th>Date &amp; Time</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="orders-tbody"></tbody>
                    </table>
                    <div id="orders-empty" class="orders-empty" hidden>
                        <span>☕</span>
                        <p>No orders found.</p>
                    </div>
                </div>
            </div>

            <!-- ── ANALYTICS VIEW ── -->
            <div class="view" id="view-analytics">
                <div class="analytics-grid" id="analytics-grid"></div>
            </div>
        </div>
    </div>

    <!-- Order Detail Modal -->
    <div id="order-modal" class="order-modal" role="dialog" aria-modal="true" aria-label="Order details">
        <div class="order-modal-content">
            <div class="order-modal-header">
                <div>
                    <h3 id="om-id"></h3>
                    <span id="om-time" class="om-time"></span>
                </div>
                <button class="om-close" id="om-close" aria-label="Close">&times;</button>
            </div>
            <div class="order-modal-body" id="om-body"></div>
        </div>
    </div>
    <div id="admin-overlay" class="admin-overlay"></div>

    <!-- Admin Toast -->
    <div id="admin-toast" class="admin-toast"></div>

    <script src="orders.js"></script>
    <script src="admin.js"></script>
</body>

</html>
